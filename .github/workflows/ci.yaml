name: Hello World CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Build message
        run: echo "Build job is running!"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test message
        run: echo "Test job is running!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy message
        run: echo "Deploy job is running!"
